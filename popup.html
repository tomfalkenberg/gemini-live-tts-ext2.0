<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gemini TTS Controls</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      width: 320px;
      padding: 12px;
      min-height: auto;
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
    }
    .popup-card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
    }
    .controls-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    .controls-container button {
      width: 36px;
      height: 36px;
      min-width: 36px;
      flex-shrink: 0;
      padding: 0;
      margin: 0;
      cursor: pointer;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.75);
      color: #1e293b;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: all 0.2s ease;
    }
    .controls-container button:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.95);
      transform: scale(1.05);
    }
    .controls-container button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }
    .volume-container {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-grow: 1;
    }
    #volumeControl {
      flex-grow: 1;
      height: 6px;
      accent-color: #4a90e2;
      cursor: pointer;
    }
    #volumeValue {
      min-width: 40px;
      text-align: right;
      font-size: 12px;
      font-weight: 500;
      color: #334155;
    }
    #status {
      margin-top: 8px;
      font-style: italic;
      text-align: center;
      font-size: 0.85em;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="popup-card">
    <div class="header-banner">
      <div class="header-left">
        <img src="icon-32.png" class="extension-icon" alt="Icon">
        <span class="extension-name">Gemini Live TTS</span>
      </div>
      <div class="header-right">
        <button class="header-btn donate-btn" title="Support the project">❤️</button>
        <button class="header-btn faq-btn" title="FAQ">❔</button>
        <button class="header-btn settings-btn" title="Settings">⚙️</button>
      </div>
    </div>
    <div class="controls-container">
      <button id="playPause" disabled>▶</button>
      <button id="stop">⏹</button>
      <div class="volume-container">
        <span class="volume-label">🔊</span>
        <input type="range" id="volumeControl" min="0" max="100" value="100">
        <span id="volumeValue">100%</span>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
